  <!-- 採用模組化語法載入 Firebase，移除了造成衝突的 Auth 模組與相容版 SDK -->

    const { useState, useEffect, useMemo, useCallback } = React;

    // 寫死的 Firebase Config
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCGlabMN4AO4Cz0Zw_ErMq4y9KSIKBXLpo",
      authDomain: "rende-hospital-repair.firebaseapp.com",
      projectId: "rende-hospital-repair",
      storageBucket: "rende-hospital-repair.firebasestorage.app",

    const CATEGORIES = ['電腦設備', '印表機', '網路設備', '醫療儀器', '其他軟硬體'];
    const UNITS = ['門診', '櫃台', '藥局', '放射室', '檢驗室', '復健科', '洗腎室', '護理部', '行政部', '本院護理之家', '忠孝護理之家', '大仁康復護理之家', '仁德居家護理所', '仁德日照中心', '國泰日照中心', '國泰綜合長照機構', '嘉義市德興居家服務', '嘉義縣德興居家服務', '嘉義縣德昇居家服務', '嘉義市育仁長照園區', '其他'];
    const STANDARD_UNITS = UNITS.filter(u => u !== '其他');
    const JOB_TITLES = ['醫師', '藥師', '檢驗師', '放射師', '護理人員', '行政人員', '營養師', '物理治療師', '職能治療師', '語言治療師', '復健治療生', '其他'];

    const DEFAULT_URGENCY_CONFIG = [
      { id: 'u1', name: '緊急', weight: 4, color: 'bg-red-100 text-red-700' },
      { id: 'u2', name: '高', weight: 3, color: 'bg-orange-100 text-orange-700' },
      { id: 'u3', name: '中', weight: 2, color: 'bg-yellow-100 text-yellow-700' },
      { id: 'u4', name: '低', weight: 1, color: 'bg-green-100 text-green-700' }
    ];

    const INITIAL_ACCOUNTS = [{ id: 'acc-admin', username: 'admin', password: 'admin123', name: '超級管理員', role: 'super_admin', expiryDate: '' }];
    const INITIAL_CONTACT_INFO = "若遇到系統緊急狀況，請撥打資訊室專線：\n分機：1234 或 5678\n負責人：王資訊長\n服務時間：週一至週五 08:00 - 17:00";
    const DEFAULT_ASSET_COLUMNS = [{ id: 'col_ip', name: 'IP位置' }, { id: 'col_years', name: '使用年限' }];

    // SVG 圖示
    const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    const IconList = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
    const IconDashboard = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
    const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconClose = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"/></svg>;
    const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconMessage = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const IconCamera = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
    const IconPhone = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
    const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    const IconFilter = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
    const IconNetwork = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>;
    const IconCode = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>;
    const IconDatabase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
    const IconCloud = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
    const IconCloudOff = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.61 16.95A4.5 4.5 0 0 0 17.5 10h-1.79A7.73 7.73 0 0 0 15 7.23"/><path d="m2 2 20 20"/><path d="M5.78 5.78A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 2.59-.81"/></svg>;
    const IconWarning = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    const IconCheckSquare = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>;
    const IconMail = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
    const IconSpinner = () => <svg className="animate-spin h-10 w-10 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>;

    // 共用元件
    const StatusBadge = ({ status }) => {
      if (status === 'completed') return <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">已結案</span>;
      if (status === 'processing') return <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">處理中</span>;
      return <span className="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">待處理</span>;
    };

    const UrgencyBadge = ({ level, config }) => {
      if (!config) return null;
      const match = config.find(c => c.name === level);
      const colorClass = match ? match.color : 'bg-slate-100 text-slate-700';
      return <span className={`${colorClass} px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap`}>{level || '未設定'}</span>;
    };

    const calculateWarranty = (purchaseDate, usefulLife) => {
      if (!purchaseDate || !usefulLife) return { valid: false, text: '資料不全', color: 'text-slate-400', icon: null };
      const start = new Date(purchaseDate);
      const end = new Date(start.setFullYear(start.getFullYear() + Number(usefulLife)));
      const now = new Date();
      const diffYears = (end - now) / (1000 * 60 * 60 * 24 * 365.25);
      if (diffYears < 0) return { valid: false, text: `已過期約 ${Math.abs(diffYears).toFixed(1)} 年`, color: 'text-red-500', icon: <IconWarning /> };
      return { valid: true, text: `剩餘約 ${diffYears.toFixed(1)} 年`, color: 'text-emerald-500', icon: <IconCheckSquare /> };
    };

    // 1. 填寫通報頁面
    const ReportPage = ({ onSubmitForm, urgencyConfig, isOnline, showToast }) => {
      const [formData, setFormData] = useState({
        unit: UNITS[0], otherUnit: '', jobTitle: JOB_TITLES[0], otherJobTitle: '', reporterName: '',
        phone: '', ext: '', mobile: '', location: '', category: CATEGORIES[0], isManagedAsset: '否',
        assetId: '', otherAsset: '', userUrgency: urgencyConfig[1]?.name || '中', title: '', description: '', photos: []
      });

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        let currentTotalSize = formData.photos.reduce((acc, p) => acc + p.file.size, 0);
        const newPhotos = [];

        for (let file of files) {
          if (file.size > 30 * 1024 * 1024) { showToast(`❌ 檔案 ${file.name} 超過 30MB 單張限制！`); continue; }
          if (currentTotalSize + file.size > 300 * 1024 * 1024) { showToast(`❌ 檔案總容量已達 300MB 上限！`); break; }
          currentTotalSize += file.size;
          newPhotos.push({ file: file, previewUrl: URL.createObjectURL(file) });
        }
        if (newPhotos.length > 0) setFormData(prev => ({ ...prev, photos: [...prev.photos, ...newPhotos] }));
        e.target.value = ''; 
      };

      const removePhoto = (idx) => {
        setFormData(prev => { URL.revokeObjectURL(prev.photos[idx].previewUrl); return { ...prev, photos: prev.photos.filter((_, i) => i !== idx) }; });
      };

      const handleSubmit = (e) => {
        e.preventDefault(); onSubmitForm(formData); setFormData({ ...formData, title: '', description: '', photos: [] });
      };

      return (
        <form onSubmit={handleSubmit} className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6 relative overflow-hidden">
          {!isOnline && <div className="absolute top-0 left-0 right-0 bg-yellow-500 text-white text-center py-1.5 text-xs font-bold z-10 shadow-sm">⚠️ 目前處於離線狀態，通報單將暫存於本機，待網路恢復後可手動同步上傳。</div>}
          <div className="flex items-center gap-3 border-b pb-4 mt-2"><div className="bg-blue-100 p-2 rounded-xl text-blue-600"><IconAlert /></div><h2 className="text-xl font-bold text-slate-800">新增資訊障礙通報</h2></div>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">機構 / 單位 (必填)</label><select value={formData.unit} onChange={e => setFormData({...formData, unit: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">{UNITS.map(u => <option key={u} value={u}>{u}</option>)}</select>{formData.unit === '其他' && <input required value={formData.otherUnit} onChange={e => setFormData({...formData, otherUnit: e.target.value})} className="w-full p-3 mt-3 bg-white border border-blue-200 rounded-xl" placeholder="請填寫機構/單位名稱" />}</div>
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">職務名稱 (必填)</label><select value={formData.jobTitle} onChange={e => setFormData({...formData, jobTitle: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">{JOB_TITLES.map(j => <option key={j} value={j}>{j}</option>)}</select>{formData.jobTitle === '其他' && <input required value={formData.otherJobTitle} onChange={e => setFormData({...formData, otherJobTitle: e.target.value})} className="w-full p-3 mt-3 bg-white border border-blue-200 rounded-xl" placeholder="請填寫職務名稱" />}</div>
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">通報人姓名 (必填)</label><input required value={formData.reporterName} onChange={e => setFormData({...formData, reporterName: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如：王大明" /></div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">電話</label><input value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl" /></div>
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">聯絡分機</label><input value={formData.ext} onChange={e => setFormData({...formData, ext: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl" /></div>
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">手機</label><input value={formData.mobile} onChange={e => setFormData({...formData, mobile: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl" /></div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">發生地點</label><input value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl" /></div>
            <div><label className="block text-sm font-semibold text-slate-700 mb-2">障礙分類</label><select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl">{CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
          </div>

          <div className="p-5 bg-slate-50 border rounded-xl">
            <label className="block text-sm font-semibold text-slate-700 mb-3">此報修是否屬於列管設備？</label>
            <div className="flex gap-4 mb-4">{['是', '否', '其他'].map(opt => (<label key={opt} className="flex items-center gap-2 cursor-pointer"><input type="radio" name="isManagedAsset" value={opt} checked={formData.isManagedAsset === opt} onChange={e => setFormData({...formData, isManagedAsset: e.target.value})} className="w-4 h-4 text-blue-600 focus:ring-blue-500" /><span className="text-sm font-medium text-slate-700">{opt}</span></label>))}</div>
            {formData.isManagedAsset === '是' && <input required value={formData.assetId} onChange={e => setFormData({...formData, assetId: e.target.value})} className="w-full p-3 bg-white border border-blue-200 rounded-xl" placeholder="請輸入資訊資產編號 (例: INF-001)" />}
            {formData.isManagedAsset === '其他' && <input required value={formData.otherAsset} onChange={e => setFormData({...formData, otherAsset: e.target.value})} className="w-full p-3 bg-white border border-blue-200 rounded-xl" placeholder="請簡單說明設備特徵" />}
          </div>

          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-2">您認為的緊急程度</label>
            <div className="flex gap-4 flex-wrap">
              {urgencyConfig.map(u => (<label key={u.id} className={`flex-1 min-w-[100px] py-3 border rounded-xl text-center cursor-pointer transition-colors font-bold text-sm ${formData.userUrgency === u.name ? 'ring-2 ring-blue-500 bg-blue-50 text-blue-800' : 'bg-white hover:bg-slate-50 text-slate-600'}`}><input type="radio" name="userUrgency" value={u.name} checked={formData.userUrgency === u.name} onChange={e => setFormData({...formData, userUrgency: e.target.value})} className="hidden" />{u.name}</label>))}
            </div>
          </div>

          <div><label className="block text-sm font-semibold text-slate-700 mb-2">障礙主旨 (必填)</label><input required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl font-bold" /></div>
          <div><label className="block text-sm font-semibold text-slate-700 mb-2">詳細狀況描述 (必填)</label><textarea required rows="4" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl resize-none"></textarea></div>

          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-2">上傳現場照片/螢幕截圖 (支援單張30MB, 總計300MB)</label>
            <label className="flex items-center justify-center w-full p-4 border-2 border-dashed border-slate-300 rounded-xl hover:bg-slate-50 cursor-pointer text-slate-500 gap-2"><IconCamera /> 點擊選擇圖片或拖曳至此<input type="file" accept="image/*" multiple className="hidden" onChange={handleImageUpload} /></label>
            {formData.photos.length > 0 && (
              <div className="mt-4 flex flex-wrap gap-4">
                {formData.photos.map((obj, idx) => (
                  <div key={idx} className="relative inline-block group"><img src={obj.previewUrl} className="h-24 w-24 object-cover rounded-lg shadow-sm border" /><div className="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-[10px] text-center rounded-b-lg py-1 truncate px-1">{(obj.file.size/1024/1024).toFixed(1)} MB</div><button type="button" onClick={() => removePhoto(idx)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><IconClose /></button></div>
                ))}
              </div>
            )}
          </div>
          <button type="submit" className={`w-full text-white font-bold py-4 rounded-xl shadow-md transition-colors ${isOnline ? 'bg-blue-600 hover:bg-blue-700' : 'bg-yellow-500 hover:bg-yellow-600'}`}>{isOnline ? '送出通報單並上傳圖片' : '離線暫存通報單'}</button>
        </form>
      );
    };

    // 2. 通報進度查詢
    const HistoryPage = ({ requests, urgencyConfig, syncQueue, handleManualSync }) => {
      const [zoomedImg, setZoomedImg] = useState(null);
      const [selectedUnits, setSelectedUnits] = useState([]);
      const [sortOption, setSortOption] = useState('time_desc');

      const handleToggleUnit = (unit) => setSelectedUnits(prev => prev.includes(unit) ? prev.filter(u => u !== unit) : [...prev, unit]);
      const handleSelectAll = () => setSelectedUnits(selectedUnits.length === UNITS.length ? [] : UNITS);

      const processedRequests = useMemo(() => {
        let filtered = selectedUnits.length === 0 ? [] : requests.filter(req => { const isStd = STANDARD_UNITS.includes(req.unit); return (isStd && selectedUnits.includes(req.unit)) || (!isStd && selectedUnits.includes('其他')); });
        return filtered.sort((a, b) => {
          switch(sortOption) {
            case 'time_desc': return new Date(b.date).getTime() - new Date(a.date).getTime();
            case 'time_asc': return new Date(a.date).getTime() - new Date(b.date).getTime();
            case 'urgency': return (urgencyConfig.find(c => c.name === b.userUrgency)?.weight || 0) - (urgencyConfig.find(c => c.name === a.userUrgency)?.weight || 0);
            case 'unit': return (a.unit || '').localeCompare(b.unit || '');
            default: return 0;
          }
        });
      }, [requests, selectedUnits, sortOption, urgencyConfig]);

      return (
        <div className="space-y-6">
          {syncQueue && syncQueue.length > 0 && (
            <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 shadow-sm">
               <div className="flex items-center gap-3 text-yellow-800"><IconCloudOff /><div><h3 className="font-bold text-sm">您有 {syncQueue.length} 筆離線通報單尚未上傳</h3><p className="text-xs opacity-80">網路恢復後，請點擊右側按鈕同步至雲端。</p></div></div>
               <button onClick={handleManualSync} className="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md flex items-center gap-2 transition-colors animate-pulse"><IconCloud /> 一鍵同步資料</button>
            </div>
          )}
          <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 border-b pb-4"><h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><IconSearch /> 單位選擇與進度查詢</h2><div className="flex items-center gap-2"><IconFilter /><span className="text-sm font-bold text-slate-600">排序：</span><select value={sortOption} onChange={e => setSortOption(e.target.value)} className="p-2 border rounded-lg text-sm bg-slate-50"><option value="time_desc">最新建檔</option><option value="time_asc">最舊建檔</option><option value="urgency">緊急程度</option><option value="unit">單位名稱</option></select></div></div>
            <div className="space-y-3">
              <label className="flex items-center gap-2 cursor-pointer w-max mb-2"><input type="checkbox" checked={selectedUnits.length === UNITS.length} onChange={handleSelectAll} className="w-4 h-4 text-blue-600 rounded" /><span className="text-sm font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded">📌 全選 / 全不選</span></label>
              <div className="flex flex-wrap gap-2">{UNITS.map(u => (<label key={u} className={`flex items-center gap-2 px-3 py-1.5 border rounded-lg cursor-pointer text-sm ${selectedUnits.includes(u) ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-50'}`}><input type="checkbox" checked={selectedUnits.includes(u)} onChange={() => handleToggleUnit(u)} className="hidden" />{u}</label>))}</div>
            </div>
          </div>
          {selectedUnits.length === 0 ? <div className="bg-white/50 rounded-3xl p-16 text-center text-slate-400 font-bold"><IconList className="mx-auto mb-2 opacity-50"/>請於上方勾選單位</div> : processedRequests.length === 0 ? <div className="bg-white rounded-3xl p-16 text-center text-slate-400 border shadow-sm font-bold"><IconList className="mx-auto mb-2"/>目前無任何紀錄</div> : (
            <div className="space-y-4">
              <div className="text-sm text-slate-500 font-bold px-2">共找到 {processedRequests.length} 筆紀錄</div>
              {processedRequests.map(req => (
                <div key={req.id} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <div className="flex gap-2 mb-2"><StatusBadge status={req.status} /><UrgencyBadge level={req.userUrgency} config={urgencyConfig}/></div>
                  <h3 className="text-lg font-bold">{req.title}</h3>
                  <p className="text-xs text-slate-400 mt-1">{req.id} • {req.date}</p>
                  <div className="text-sm text-slate-600 mt-4 bg-slate-50 p-3 rounded-xl border">單位：{req.unit} | 通報人：{req.reporterName} | 地點：{req.location} | 設備：{req.deviceName}</div>
                  <p className="text-sm text-slate-700 mt-3 bg-slate-50 p-4 rounded-xl border whitespace-pre-wrap">{req.description}</p>
                  {req.photos && req.photos.length > 0 && (<div className="mt-4 flex flex-wrap gap-2">{req.photos.map((p, i) => <img key={i} src={p} onClick={() => setZoomedImg(p)} className="h-20 w-20 object-cover rounded-lg border cursor-zoom-in hover:opacity-80" />)}</div>)}
                  {req.reply && <div className="mt-4 bg-blue-50 p-4 rounded-xl border-l-4 border-blue-400 font-bold text-blue-800 text-sm"><IconMessage className="inline mr-1"/>回覆：{req.reply}</div>}
                </div>
              ))}
            </div>
          )}
          {zoomedImg && <div className="fixed inset-0 bg-black/90 z-[999] flex items-center justify-center p-4 cursor-zoom-out" onClick={() => setZoomedImg(null)}><img src={zoomedImg} className="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" /></div>}
        </div>
      );
    };

    // 3. 處理看板 (管理員)
    const AdminDashboard = ({ requests, onUpdateStatus, onDeleteRequest, urgencyConfig }) => {
      const [editingId, setEditingId] = useState(null);
      const [editForm, setEditForm] = useState({ status: 'pending', reply: '', assignee: '', adminUrgency: '' });
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [zoomedImg, setZoomedImg] = useState(null);
      const sorted = useMemo(() => [...requests].sort((a, b) => new Date(b.date) - new Date(a.date)), [requests]);

      return (
        <div className="space-y-4">
          <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100 flex items-center gap-3"><IconAlert /><span className="text-sm text-blue-800 font-bold">管理員專區：共 {requests.length} 筆通報單</span></div>
          {sorted.map(req => (
            <div key={req.id} className="bg-white p-6 rounded-2xl shadow-sm border relative">
              {confirmDeleteId === req.id ? (
                <div className="absolute top-4 right-4 flex items-center gap-2 bg-red-50 px-3 py-1 rounded-lg border border-red-100"><span className="text-xs font-bold text-red-600">確認刪除？</span><button onClick={() => { onDeleteRequest(req.id); setConfirmDeleteId(null); }} className="text-xs bg-red-600 text-white px-2 py-1 rounded">是</button><button onClick={() => setConfirmDeleteId(null)} className="text-xs bg-slate-200 text-slate-700 px-2 py-1 rounded">否</button></div>
              ) : (<button onClick={() => setConfirmDeleteId(req.id)} className="absolute top-4 right-4 text-slate-300 hover:text-red-500"><IconTrash /></button>)}
              
              <div className="flex gap-2 mb-2"><StatusBadge status={req.status} /> <UrgencyBadge level={req.userUrgency} config={urgencyConfig}/> {req.adminUrgency && <span className="text-xs bg-purple-100 text-purple-700 px-2 rounded font-bold">內部: {req.adminUrgency}</span>}</div>
              <h3 className="text-lg font-bold">{req.title}</h3>
              <p className="text-xs text-slate-400 mb-2">{req.id} | {req.date}</p>
              <div className="grid grid-cols-2 gap-2 text-sm bg-slate-50 p-3 rounded-xl border mb-3"><div><strong>單位:</strong> {req.unit}</div><div><strong>設備:</strong> {req.deviceName}</div><div><strong>通報人:</strong> {req.reporterName}</div><div><strong>電話:</strong> {req.phone} {req.ext} {req.mobile}</div></div>
              <p className="text-sm mb-4 whitespace-pre-wrap">{req.description}</p>
              {req.photos && req.photos.length > 0 && (<div className="mb-4"><span className="block text-xs font-bold text-slate-500 mb-2">附件圖片：</span><div className="flex flex-wrap gap-2">{req.photos.map((p, idx) => (<img key={idx} src={p} onClick={() => setZoomedImg(p)} className="h-16 w-16 object-cover rounded-lg border cursor-zoom-in hover:opacity-80" />))}</div></div>)}

              {editingId === req.id ? (
                <div className="mt-4 bg-blue-50 p-4 rounded-xl space-y-3 border border-blue-100">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <select value={editForm.status} onChange={e=>setEditForm({...editForm, status: e.target.value})} className="p-2 border rounded-lg text-sm bg-white"><option value="pending">待處理</option><option value="processing">處理中</option><option value="completed">已結案</option></select>
                    <select value={editForm.adminUrgency} onChange={e=>setEditForm({...editForm, adminUrgency: e.target.value})} className="p-2 border rounded-lg text-sm bg-white"><option value="">內部緊急度</option>{urgencyConfig.map(u=><option key={u.id} value={u.name}>{u.name}</option>)}</select>
                    <input value={editForm.assignee} onChange={e=>setEditForm({...editForm, assignee: e.target.value})} className="p-2 border rounded-lg text-sm bg-white" placeholder="指派人員" />
                  </div>
                  <textarea value={editForm.reply} onChange={e=>setEditForm({...editForm, reply: e.target.value})} className="w-full p-3 border rounded-lg text-sm bg-white" rows="2" placeholder="公開回覆內容..."></textarea>
                  <div className="flex gap-2 justify-end"><button onClick={()=>setEditingId(null)} className="px-4 py-2 text-sm bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300">取消</button><button onClick={()=>{onUpdateStatus(req.id, editForm.status, editForm.reply, editForm.assignee, editForm.adminUrgency, req.title); setEditingId(null);}} className="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg font-bold shadow-md hover:bg-blue-700">儲存並通知</button></div>
                </div>
              ) : (
                <div className="mt-4 pt-4 border-t flex justify-between items-center"><p className="text-sm text-slate-600 truncate mr-4"><strong>回覆：</strong> {req.reply || '尚未回覆'}</p><button onClick={()=>{setEditingId(req.id); setEditForm({status: req.status, reply: req.reply||'', assignee: req.assignee||'', adminUrgency: req.adminUrgency||''});}} className="px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold rounded-lg text-sm shrink-0">編輯</button></div>
              )}
            </div>
          ))}
          {zoomedImg && <div className="fixed inset-0 bg-black/90 z-[999] flex items-center justify-center p-4 cursor-zoom-out" onClick={() => setZoomedImg(null)}><img src={zoomedImg} className="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" /></div>}
        </div>
      );
    };

    // 4. 財產管理
    const AssetsPage = ({ assets, assetColumns, onAddAsset, onEditAsset, onDeleteAsset }) => {
      const [newAsset, setNewAsset] = useState({ id: '', name: '', category: CATEGORIES[0], ipAddress: '', purchaseDate: '', usefulLife: 5, status: '正常', customData: {} });
      const [editingAssetId, setEditingAssetId] = useState(null);
      const [editAssetData, setEditAssetData] = useState(null);

      const handleAdd = (e) => {
        e.preventDefault(); onAddAsset({ ...newAsset, uid: Date.now().toString() });
        setNewAsset({ id: '', name: '', category: CATEGORIES[0], ipAddress: '', purchaseDate: '', usefulLife: 5, status: '正常', customData: {} });
      };
      const handleSaveEdit = () => { onEditAsset(editingAssetId, editAssetData); setEditingAssetId(null); };

      return (
        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6">
          <div className="flex items-center gap-3 border-b pb-4 mb-6"><div className="bg-emerald-100 p-2 rounded-xl text-emerald-600"><IconDatabase /></div><h2 className="text-xl font-bold text-slate-800">資訊財產管理</h2></div>
          <form onSubmit={handleAdd} className="bg-slate-50 p-5 rounded-2xl border mb-6 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div className="md:col-span-4 text-sm font-bold text-slate-600 mb-1">新增資訊資產</div>
            <div><label className="block text-xs text-slate-500 mb-1">編號</label><input required value={newAsset.id} onChange={e=>setNewAsset({...newAsset, id: e.target.value})} placeholder="例: PC-001" className="w-full p-2 border rounded-lg text-sm bg-white" /></div>
            <div><label className="block text-xs text-slate-500 mb-1">設備名稱</label><input required value={newAsset.name} onChange={e=>setNewAsset({...newAsset, name: e.target.value})} placeholder="設備名稱" className="w-full p-2 border rounded-lg text-sm bg-white" /></div>
            <div><label className="block text-xs text-slate-500 mb-1">類別</label><select value={newAsset.category} onChange={e=>setNewAsset({...newAsset, category: e.target.value})} className="w-full p-2 border rounded-lg text-sm bg-white">{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
            <div><label className="block text-xs text-slate-500 mb-1">IP 位置</label><input value={newAsset.ipAddress} onChange={e=>setNewAsset({...newAsset, ipAddress: e.target.value})} placeholder="例: 192.168.1.100" className="w-full p-2 border rounded-lg text-sm bg-white" /></div>
            <div><label className="block text-xs text-slate-500 mb-1">購買出廠日期</label><input type="date" required value={newAsset.purchaseDate} onChange={e=>setNewAsset({...newAsset, purchaseDate: e.target.value})} className="w-full p-2 border rounded-lg text-sm bg-white" /></div>
            <div><label className="block text-xs text-slate-500 mb-1">使用年限 (年)</label><input type="number" min="1" required value={newAsset.usefulLife} onChange={e=>setNewAsset({...newAsset, usefulLife: e.target.value})} className="w-full p-2 border rounded-lg text-sm bg-white" /></div>
            <div><label className="block text-xs text-slate-500 mb-1">狀態</label><select value={newAsset.status} onChange={e=>setNewAsset({...newAsset, status: e.target.value})} className="w-full p-2 border rounded-lg text-sm bg-white"><option value="正常">正常</option><option value="故障">故障</option><option value="報廢">報廢</option></select></div>
            {assetColumns.map(col => (<div key={col.id}><label className="block text-xs text-slate-500 mb-1">{col.name}</label><input value={newAsset.customData[col.id]||''} onChange={e=>setNewAsset({...newAsset, customData: {...newAsset.customData, [col.id]: e.target.value}})} className="w-full p-2 border rounded-lg text-sm bg-white" /></div>))}
            <button className="bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg font-bold shadow-md w-full h-9 mt-2 md:col-span-4">新增資產</button>
          </form>

          <div className="overflow-x-auto excel-table">
            <table className="w-full text-left text-sm border-collapse min-w-[800px]">
               <thead><tr className="border-b bg-slate-50"><th className="p-3">編號</th><th className="p-3">名稱 / 類別</th><th className="p-3">IP 位置</th><th className="p-3">狀態</th><th className="p-3">購買出廠日期</th><th className="p-3 text-center">使用年限</th><th className="p-3">保固狀態計算</th>{assetColumns.map(c => <th key={c.id} className="p-3 text-indigo-700">{c.name}</th>)}<th className="p-3 text-center">操作</th></tr></thead>
               <tbody>
                  {assets.map(a => {
                    const isEditing = editingAssetId === a.uid; const warranty = calculateWarranty(a.purchaseDate, a.usefulLife);
                    return (
                    <tr key={a.uid} className="border-b hover:bg-slate-50">
                      {isEditing ? (
                         <>
                           <td className="p-2"><input value={editAssetData.id} onChange={e=>setEditAssetData({...editAssetData, id: e.target.value})} className="w-20 p-1 border rounded text-xs" /></td>
                           <td className="p-2 space-y-1"><input value={editAssetData.name} onChange={e=>setEditAssetData({...editAssetData, name: e.target.value})} className="w-full p-1 border rounded text-xs" /><select value={editAssetData.category} onChange={e=>setEditAssetData({...editAssetData, category: e.target.value})} className="w-full p-1 border rounded text-xs">{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></td>
                           <td className="p-2"><input value={editAssetData.ipAddress} onChange={e=>setEditAssetData({...editAssetData, ipAddress: e.target.value})} className="w-24 p-1 border rounded text-xs" /></td>
                           <td className="p-2"><select value={editAssetData.status} onChange={e=>setEditAssetData({...editAssetData, status: e.target.value})} className="p-1 border rounded text-xs"><option value="正常">正常</option><option value="故障">故障</option><option value="報廢">報廢</option></select></td>
                           <td className="p-2"><input type="date" value={editAssetData.purchaseDate} onChange={e=>setEditAssetData({...editAssetData, purchaseDate: e.target.value})} className="p-1 border rounded text-xs" /></td>
                           <td className="p-2 text-center"><input type="number" min="1" value={editAssetData.usefulLife} onChange={e=>setEditAssetData({...editAssetData, usefulLife: e.target.value})} className="w-12 p-1 border rounded text-xs text-center" /></td>
                           <td className="p-2 text-xs text-slate-400">儲存後重新計算</td>
                           {assetColumns.map(col => <td key={col.id} className="p-2"><input value={editAssetData.customData?.[col.id]||''} onChange={e=>setEditAssetData({...editAssetData, customData: {...editAssetData.customData, [col.id]: e.target.value}})} className="w-full p-1 border rounded text-xs" /></td>)}
                           <td className="p-2 text-center space-x-1"><button onClick={handleSaveEdit} className="bg-blue-600 text-white px-2 py-1 rounded text-xs font-bold">儲存</button><button onClick={()=>setEditingAssetId(null)} className="bg-slate-300 text-slate-800 px-2 py-1 rounded text-xs">取消</button></td>
                         </>
                      ) : (
                         <>
                           <td className="p-3 font-mono font-bold text-slate-700">{a.id}</td><td className="p-3"><div className="font-bold text-slate-800">{a.name}</div><div className="text-xs text-slate-400 mt-1">{a.category}</div></td><td className="p-3 font-mono text-xs">{a.ipAddress || '-'}</td><td className="p-3"><span className={`px-2 py-1 rounded text-xs font-bold ${a.status==='正常'?'bg-green-100 text-green-700': a.status==='故障'?'bg-red-100 text-red-700':'bg-gray-200 text-gray-700'}`}>{a.status}</span></td><td className="p-3 font-mono text-slate-600">{a.purchaseDate}</td><td className="p-3 text-center font-bold text-slate-600">{a.usefulLife} 年</td><td className="p-3"><span className={`flex items-center gap-1.5 font-medium text-xs ${warranty.color}`}>{warranty.icon} {warranty.text}</span></td>{assetColumns.map(col => <td key={col.id} className="p-3 text-slate-600">{a.customData?.[col.id] || '-'}</td>)}

    // 9. 帳號管理頁面 
    const AccountsPage = ({ accounts, onAddAccount, onEditAccount, onDeleteAccount }) => {

          <div className="flex items-center gap-3 border-b pb-4 mb-6"><div className="bg-indigo-100 p-2 rounded-xl text-indigo-600"><IconUsers /></div><h2 className="text-xl font-bold text-slate-800">帳號與權限管理</h2></div>

            <input required value={newAcc.username} onChange={e=>setNewAcc({...newAcc, username: e.target.value})} className="p-2.5 rounded-xl border focus:ring-2 focus:ring-blue-500 text-sm" placeholder="帳號 (如: user01)" />
            <input required value={newAcc.password} onChange={e=>setNewAcc({...newAcc, password: e.target.value})} className="p-2.5 rounded-xl border focus:ring-2 focus:ring-blue-500 text-sm" placeholder="密碼" />

    // ==========================================
    // 主應用程式 Component
    // ==========================================
    function App() {
      // 讀取 localStorage 判斷是否為登入狀態
      const sessionStr = localStorage.getItem('it_session');
      const initSession = sessionStr ? JSON.parse(sessionStr) : null;
      
      const [userRole, setUserRole] = useState(initSession && initSession.expire > Date.now() ? initSession.role : 'guest'); 
      const [userName, setUserName] = useState(initSession && initSession.expire > Date.now() ? initSession.name : '');
      const [activePage, setActivePage] = useState('report');
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [toastMsg, setToastMsg] = useState('');
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3500); };

      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [dbInstance, setDbInstance] = useState(null);
      const [storageInstance, setStorageInstance] = useState(null);
      const [connectionMode, setConnectionMode] = useState('本地緩存模式');
      const [firebaseError, setFirebaseError] = useState('');
      const [uploadingState, setUploadingState] = useState({ isUploading: false, text: '' });

      const [customLogo, setCustomLogo] = useState(localStorage.getItem('sys_logo') || '');
      const [contactInfo, setContactInfo] = useState(localStorage.getItem('sys_contact') || INITIAL_CONTACT_INFO);
      const [urgencyConfig, setUrgencyConfig] = useState(() => JSON.parse(localStorage.getItem('sys_urgency_config')) || DEFAULT_URGENCY_CONFIG);
      const [emailConfig, setEmailConfig] = useState(() => JSON.parse(localStorage.getItem('sys_email_config')) || []);
      const [assetColumns, setAssetColumns] = useState(() => JSON.parse(localStorage.getItem('sys_asset_cols')) || DEFAULT_ASSET_COLUMNS);
      
      const [requests, setRequests] = useState(() => JSON.parse(localStorage.getItem('sys_requests')) || []);
      const [accounts, setAccounts] = useState(() => JSON.parse(localStorage.getItem('sys_accounts')) || INITIAL_ACCOUNTS);
      const [assets, setAssets] = useState(() => JSON.parse(localStorage.getItem('sys_assets')) || []);
      const [syncQueue, setSyncQueue] = useState(() => JSON.parse(localStorage.getItem('sys_sync_queue')) || []);

      // 初始化 Firebase 
      useEffect(() => {
        let unsubscribeReq = () => {}; let unsubscribeAcc = () => {}; let unsubscribeAst = () => {};

        const initFirebase = async () => {
           try {
             const app = getApps().length === 0 ? initializeApp(FIREBASE_CONFIG) : getApps()[0];
             const db = getFirestore(app); 
             const storage = getStorage(app);

             setDbInstance(db); setStorageInstance(storage); setConnectionMode('雲端即時同步 (大檔支援)');

             unsubscribeReq = onSnapshot(collection(db, 'requests'), snap => {
               const list = []; snap.forEach(doc => list.push(doc.data())); setRequests(list.sort((a, b) => new Date(b.date) - new Date(a.date))); setFirebaseError('');
             }, err => { if(err.code === 'permission-denied') setFirebaseError('【資料庫權限不足】請至 Firebase 控制台的 Firestore Rules 將規則改為 allow read, write: if true;'); });
             
             unsubscribeAcc = onSnapshot(collection(db, 'accounts'), snap => {
               const list = []; snap.forEach(doc => list.push(doc.data())); if(list.length > 0) setAccounts(list);
             });
             
             unsubscribeAst = onSnapshot(collection(db, 'assets'), snap => {
               const list = []; snap.forEach(doc => list.push(doc.data())); if(list.length > 0) setAssets(list);
             });
           } catch(e) { console.error("Firebase 初始化失敗:", e); setFirebaseError(" Firebase 連線異常: " + e.message); }
        };

        if (isOnline) { initFirebase(); }
        const handleOnline = () => setIsOnline(true); const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline); window.addEventListener('offline', handleOffline);

        return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); unsubscribeReq(); unsubscribeAcc(); unsubscribeAst(); }
      }, [isOnline]);

      // 本地緩存
      useEffect(() => { if(!dbInstance) localStorage.setItem('sys_requests', JSON.stringify(requests)); }, [requests, dbInstance]);
      useEffect(() => { if(!dbInstance) localStorage.setItem('sys_accounts', JSON.stringify(accounts)); }, [accounts, dbInstance]);
      useEffect(() => { if(!dbInstance) localStorage.setItem('sys_assets', JSON.stringify(assets)); }, [assets, dbInstance]);
      useEffect(() => { localStorage.setItem('sys_sync_queue', JSON.stringify(syncQueue)); }, [syncQueue]);

      const handleManualSync = async () => {
         if (!isOnline || !dbInstance) { showToast("⚠️ 目前沒有網路連線，無法同步"); return; }
         if (syncQueue.length === 0) return;
         setUploadingState({ isUploading: true, text: `準備同步 ${syncQueue.length} 筆離線通報單...` });
         try {
            for (let j = 0; j < syncQueue.length; j++) {
               const req = syncQueue[j];
               setUploadingState({ isUploading: true, text: `正在同步第 ${j+1} 筆單據...` });
               await setDoc(doc(dbInstance, 'requests', req.id), req);
            }
            setSyncQueue([]); showToast(`✅ 離線單據同步成功！`);
         } catch(e) { console.error(e); showToast(`❌ 同步失敗，請檢查權限或稍後再試。`); } finally { setUploadingState({ isUploading: false, text: '' }); }
      };

      const simulateSendEmail = (subject) => {
        const activeEmails = emailConfig.filter(e => e.active);
        if (activeEmails.length > 0) setTimeout(() => { showToast(`📧 已發送通知信至 ${activeEmails.length} 個聯絡人`); }, 800);
      };

      const handleLogin = (e) => {
        e.preventDefault(); const fd = new FormData(e.target);
        const matched = accounts.find(a => a.username === fd.get('username') && a.password === fd.get('password'));
        if (matched) { 
          setUserRole(matched.role); setUserName(matched.name); setActivePage('dashboard'); setShowLoginModal(false); showToast(`✅ 登入成功`); 
          // 寫入 Session，登入維持 7 天
          localStorage.setItem('it_session', JSON.stringify({ role: matched.role, name: matched.name, expire: Date.now() + 7 * 24 * 3600000 }));
        } 
        else { showToast('❌ 登入失敗：帳號或密碼錯誤！'); }
      };

      const handleSubmitRequest = async (formData) => {
        const reqTitle = formData.title || '無主旨'; const finalUnit = formData.unit === '其他' ? formData.otherUnit : formData.unit; const finalJobTitle = formData.jobTitle === '其他' ? formData.otherJobTitle : formData.jobTitle;
        let finalDeviceName = formData.isManagedAsset === '是' ? `列管資產: ${formData.assetId}` : formData.isManagedAsset === '其他' ? `非列管/其他: ${formData.otherAsset}` : '非列管設備';
        const reqId = `REQ-${Date.now().toString().slice(-5)}`;
        const baseReq = { ...formData, unit: finalUnit, jobTitle: finalJobTitle, deviceName: finalDeviceName, id: reqId, status: 'pending', date: new Date().toLocaleString('zh-TW', { hour12: false }), reply: '', assignee: '', adminUrgency: '' };
        
        if (isOnline && dbInstance && storageInstance) {
            setUploadingState({ isUploading: true, text: '準備上傳資料...' });
            try {
                const uploadedUrls = [];
                for (let i = 0; i < formData.photos.length; i++) {
                    const photoObj = formData.photos[i];
                    if (photoObj.file) {
                        setUploadingState({ isUploading: true, text: `正在上傳圖片 ${i+1} / ${formData.photos.length} ... (大檔請稍候)` });
                        const fileRef = ref(storageInstance, `requests/${reqId}/${Date.now()}_${photoObj.file.name}`);
                        await uploadBytes(fileRef, photoObj.file);
                        uploadedUrls.push(await getDownloadURL(fileRef));
                    }
                }
                setUploadingState({ isUploading: true, text: '儲存通報單...' });
                baseReq.photos = uploadedUrls;
                await setDoc(doc(dbInstance, 'requests', reqId), baseReq);
                showToast('🚀 通報單已成功送出至雲端！'); simulateSendEmail(`[新通報] ${reqTitle}`); setActivePage('history');
            } catch(e) { console.error(e); showToast('❌ 上傳失敗，請確認 Storage 安全規則已開放！'); } finally { setUploadingState({ isUploading: false, text: '' }); }
        } else {
            const totalSize = formData.photos.reduce((acc, p) => acc + (p.file?.size || 0), 0);
            if (totalSize > 700 * 1024) { alert('⚠️ 系統目前為離線狀態。\n受限於瀏覽器限制，無法暫存大檔案。\n請連接網路後再送出，或控制在 700KB 內。'); return; }
            setUploadingState({ isUploading: true, text: '正在轉為離線格式...' });
            const base64Photos = await Promise.all(formData.photos.map(p => { return new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(p.file); }); }));
            baseReq.photos = base64Photos;
            setSyncQueue([baseReq, ...syncQueue]); setRequests([baseReq, ...requests]);    
            showToast('⚠️ 目前離線，單據已排隊暫存，請於網路恢復後至查詢頁點擊同步。'); setActivePage('history'); setUploadingState({ isUploading: false, text: '' });
        }
      };

      const handleUpdateStatus = async (id, status, reply, assignee, adminUrgency, title) => {
        if (dbInstance && isOnline) { await updateDoc(doc(dbInstance, 'requests', id), { status, reply, assignee, adminUrgency }); } 
        else { setRequests(requests.map(req => req.id === id ? { ...req, status, reply, assignee, adminUrgency } : req)); }
        showToast('💾 狀態已更新儲存'); if (reply) simulateSendEmail(`[回覆通知] 關於您的通報: ${title}`);
      };

      const handleDeleteRequest = async (id) => {
        if (dbInstance && isOnline) { await deleteDoc(doc(dbInstance, 'requests', id)); } else { setRequests(requests.filter(r => r.id !== id)); setSyncQueue(syncQueue.filter(r => r.id !== id)); }
        showToast('🗑️ 單據已刪除');
      };

      const handleAddAccount = async (accData) => { const newAcc = { ...accData, id: `ACC-${Date.now()}` }; if (dbInstance && isOnline) { await setDoc(doc(dbInstance, 'accounts', newAcc.id), newAcc); } else { setAccounts([...accounts, newAcc]); } showToast('👥 新帳號已建立'); };
      const handleEditAccount = async (id, data) => { if (dbInstance && isOnline) { await updateDoc(doc(dbInstance, 'accounts', id), data); } else { setAccounts(accounts.map(a => a.id === id ? {...data, id} : a)); } showToast('✅ 帳號資料已更新'); };
      const handleDeleteAccount = async (id) => { if (dbInstance && isOnline) { await deleteDoc(doc(dbInstance, 'accounts', id)); } else { setAccounts(accounts.filter(a => a.id !== id)); } showToast('🗑️ 帳號已刪除'); };

      const handleAddAsset = async (data) => { if (dbInstance && isOnline) { await setDoc(doc(dbInstance, 'assets', data.uid), data); } else { setAssets([...assets, data]); } showToast("✅ 資產新增成功"); };
      const handleEditAsset = async (uid, data) => { if (dbInstance && isOnline) { await updateDoc(doc(dbInstance, 'assets', uid), data); } else { setAssets(assets.map(a => a.uid === uid ? data : a)); } showToast("✅ 資產更新成功"); };
      const handleDeleteAsset = async (uid) => { if (dbInstance && isOnline) { await deleteDoc(doc(dbInstance, 'assets', uid)); } else { setAssets(assets.filter(a => a.uid !== uid)); } showToast("🗑️ 資產已刪除"); };

      const NavTab = ({ id, icon, label, isActive }) => ( <button onClick={() => setActivePage(id)} className={`flex items-center gap-2 py-4 border-b-2 font-bold text-sm transition-colors whitespace-nowrap px-3 ${isActive ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>{icon} {label}</button> );

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800 relative">
          {uploadingState.isUploading && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center text-white"><div className="mb-6 animate-pulse"><IconSpinner /></div><h2 className="text-2xl font-bold mb-2">{uploadingState.text}</h2><p className="text-slate-300 text-sm font-medium">檔案較大時可能需要幾分鐘，請勿關閉網頁</p></div>
          )}
          {firebaseError && <div className="bg-red-500 text-white p-3 text-center text-sm font-bold shadow-md relative z-40 animate-pulse">⚠️ {firebaseError}</div>}
          <header className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4">
              <div className="flex justify-between items-center py-4">
                <div className="flex items-center gap-3">
                  {customLogo ? <img src={customLogo} className="h-10 w-auto object-contain" /> : <div className="bg-blue-600 p-2 rounded-xl text-white shadow-sm"><IconDashboard /></div>}
                  <div><h1 className="font-extrabold text-xl tracking-tight">仁德醫療 - 資訊室服務台</h1><div className="flex items-center gap-2 mt-1"><p className="text-[10px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded font-bold">{connectionMode}</p><p className={`text-[10px] px-2 py-0.5 rounded font-bold flex items-center gap-1 ${isOnline ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{isOnline ? <IconCloud/> : <IconCloudOff/>} {isOnline ? '已連線' : '離線中'}</p></div></div>
                </div>
                <div>{userRole !== 'guest' ? (<div className="flex items-center gap-4"><span className="text-sm font-bold text-slate-600"><IconUsers className="inline w-4 h-4 mr-1"/>{userName}</span><button onClick={()=>{setUserRole('guest'); localStorage.removeItem('it_session'); showToast('已登出');}} className="text-sm font-bold text-red-500 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg">登出</button></div>) : (<button onClick={() => setShowLoginModal(true)} className="text-sm font-bold text-blue-600 hover:text-white bg-blue-50 hover:bg-blue-600 px-4 py-2 rounded-lg transition-colors shadow-sm">登入後台</button>)}</div>
              </div>
              <div className="flex gap-2 overflow-x-auto scrollbar-hide -mb-px">
                <NavTab id="report" isActive={activePage === 'report'} icon={<IconAlert />} label="填寫通報" />
                <NavTab id="history" isActive={activePage === 'history'} icon={<IconList />} label="進度查詢" />
                <NavTab id="contact" isActive={activePage === 'contact'} icon={<IconPhone />} label="聯絡資訊" />
                {userRole !== 'guest' && (
                  <>
                    <div className="w-[2px] h-4 bg-slate-200 self-center rounded-full mx-2 shrink-0"></div>
                    <NavTab id="dashboard" isActive={activePage === 'dashboard'} icon={<IconDashboard />} label="處理看板" />
                    <NavTab id="assets" isActive={activePage === 'assets'} icon={<IconDatabase />} label="財產管理" />
                    <NavTab id="topology" isActive={activePage === 'topology'} icon={<IconNetwork />} label="網路拓譜" />
                    <NavTab id="software" isActive={activePage === 'software'} icon={<IconCode />} label="軟體授權" />
                    {userRole === 'super_admin' && <NavTab id="accounts" isActive={activePage === 'accounts'} icon={<IconUsers />} label="帳號管理" />}
                    {userRole === 'super_admin' && <NavTab id="config" isActive={activePage === 'config'} icon={<IconSettings />} label="系統設定" />}
                  </>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1 w-full max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
            {activePage === 'report' && <ReportPage onSubmitForm={handleSubmitRequest} urgencyConfig={urgencyConfig} isOnline={isOnline} showToast={showToast} />}
            {activePage === 'history' && <HistoryPage requests={requests} urgencyConfig={urgencyConfig} syncQueue={syncQueue} handleManualSync={handleManualSync} />}
            {activePage === 'contact' && <ContactPage info={contactInfo} />}
            {activePage === 'dashboard' && userRole !== 'guest' && <AdminDashboard requests={requests} onUpdateStatus={handleUpdateStatus} onDeleteRequest={handleDeleteRequest} urgencyConfig={urgencyConfig} />}
            {activePage === 'assets' && userRole !== 'guest' && <AssetsPage assets={assets} assetColumns={assetColumns} onAddAsset={handleAddAsset} onEditAsset={handleEditAsset} onDeleteAsset={handleDeleteAsset} />}
            {activePage === 'topology' && userRole !== 'guest' && <TopologyPage isSuperAdmin={userRole === 'super_admin'} showToast={showToast} />}
            {activePage === 'software' && userRole !== 'guest' && <SoftwarePage isSuperAdmin={userRole === 'super_admin'} showToast={showToast} />}
            {activePage === 'accounts' && userRole === 'super_admin' && <AccountsPage accounts={accounts} onAddAccount={handleAddAccount} onEditAccount={handleEditAccount} onDeleteAccount={handleDeleteAccount} />}
            {activePage === 'config' && userRole === 'super_admin' && <ConfigPage onSave={(l, c) => {localStorage.setItem('sys_logo', l); localStorage.setItem('sys_contact', c); setCustomLogo(l); setContactInfo(c); showToast('✅ 設定已儲存');}} initLogo={customLogo} initContact={contactInfo} urgencyConfig={urgencyConfig} onUpdateUrgencyConfig={(c) => {setUrgencyConfig(c); localStorage.setItem('sys_urgency_config', JSON.stringify(c));}} emailConfig={emailConfig} onUpdateEmailConfig={(e) => {setEmailConfig(e); localStorage.setItem('sys_email_config', JSON.stringify(e));}} assetColumns={assetColumns} onUpdateAssetColumns={(c) => {setAssetColumns(c); localStorage.setItem('sys_asset_cols', JSON.stringify(c));}} showToast={showToast} />}
          </main>

          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-in fade-in">
              <div className="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl relative animate-in zoom-in-95">
                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 p-2 hover:bg-slate-100 rounded-full transition-colors"><IconClose /></button>
                <div className="flex justify-center mb-4 text-blue-600"><IconSettings /></div>
                <h2 className="text-xl font-bold text-center mb-6 text-slate-800">管理員登入</h2>
                <form onSubmit={handleLogin} className="space-y-4">
                  <input name="username" placeholder="帳號 (預設: admin)" className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required />
                  <input name="password" type="password" placeholder="密碼 (預設: admin123)" className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required />
                  <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl shadow-lg transition-colors">登入系統</button>
                </form>
              </div>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 animate-in slide-in-from-bottom-8 fade-in z-[999] font-bold text-sm">
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
