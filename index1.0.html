<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仁德醫療體系 - 資訊室障礙通報系統</title>
  
  <!-- 載入核心外掛：Tailwind CSS, FontAwesome, React, Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .login-modal { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const { useState, useEffect, useRef } = React;

    const DEFAULT_ACCOUNTS = [
      { username: 'admin', password: 'admin123', role: 'admin', name: '資訊室成員', expiryDate: '2035-12-31' }
    ];

    const CATEGORIES = [
      { id: 'medical_it', name: '醫療儀器資訊連線', icon: 'fa-heart-pulse', color: 'bg-teal-50 text-teal-700' },
      { id: 'it_telecom', name: '電腦與印表機設備', icon: 'fa-desktop', color: 'bg-blue-50 text-blue-700' },
      { id: 'network', name: '網路與電話通訊', icon: 'fa-wifi', color: 'bg-cyan-50 text-cyan-700' },
      { id: 'other', name: '其他軟硬體需求', icon: 'fa-hospital', color: 'bg-slate-50 text-slate-700' }
    ];

    const REQUEST_TYPES = [
      { id: 'repair', name: '故障排除通報', icon: 'fa-triangle-exclamation', badgeColor: 'bg-red-50 text-red-700 border-red-100' },
      { id: 'apply', name: '權限與耗材申請', icon: 'fa-circle-plus', badgeColor: 'bg-emerald-50 text-emerald-700 border-emerald-100' },
      { id: 'cancel', name: '通報撤銷作廢', icon: 'fa-ban', badgeColor: 'bg-slate-50 text-slate-700 border-slate-100' }
    ];

    const URGENCY_LEVELS = [
      { id: 'low', name: '低 (不影響病房醫療運作)', color: 'text-green-600 bg-green-50' },
      { id: 'medium', name: '中 (部分功能異常/已有備品)', color: 'text-yellow-600 bg-yellow-50' },
      { id: 'high', name: '高 (醫療系統中斷/影響病人安全)', color: 'text-red-600 bg-red-50' }
    ];

    // ==========================================
    // 呼叫 Gemini AI 的輔助函數 (含指數退避重試機制)
    // ==========================================
    async function fetchAIResponse(userQuery, customKey) {
      if (!customKey) {
        return "系統提示：目前 AI 助理尚未設定 API 金鑰。資訊室成員可登入後，至「同步設定」分頁貼上您的 Gemini API Key 來啟用真實 AI 排障分析。";
      }

      const delays = [1000, 2000, 4000, 8000, 16000];
      const systemInstruction = "你是一個專業、友善的醫院「資訊室運作維護」客服助理。請針對使用者遇到的臨床電腦連線、醫令印表機故障、網路電話中斷等問題，簡短提供專業的繁體中文排障建議。";

      for (let i = 0; i < 5; i++) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${customKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userQuery }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] }
            })
          });

          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          
          const data = await response.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我目前無法理解您的問題。";
        } catch (error) {
          if (i === 4) return "抱歉，目前 AI 引擎連線繁忙，請稍後再試。";
          await new Promise(resolve => setTimeout(resolve, delays[i]));
        }
      }
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState({ username: 'guest', role: 'guest', name: '院區同仁' });
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [activeTab, setActiveTab] = useState('form');
      const [requests, setRequests] = useState([]);
      const [accounts, setAccounts] = useState([]);
      const [devices, setDevices] = useState([]);
      const [notification, setNotification] = useState(null);
      const [dbActive, setDbActive] = useState(false);
      const [dbInstance, setDbInstance] = useState(null);

      // 表單與資產狀態
      const [formData, setFormData] = useState({
        requestType: 'repair', title: '', category: 'it_telecom', deviceId: '', otherDeviceName: '', location: '', urgency: 'medium', description: '', guestName: '', guestExt: ''
      });
      const [newDevice, setNewDevice] = useState({ name: '', category: 'it_telecom', purchaseDate: '', usefulLife: 5 });
      const [editingReqId, setEditingReqId] = useState(null);
      const [adminStatus, setAdminStatus] = useState('pending');
      const [adminReply, setAdminReply] = useState('');

      // 雲端與後台設定金鑰
      const [firebaseConfigStr, setFirebaseConfigStr] = useState('');
      const [geminiKey, setGeminiKey] = useState('');

      // 客服對話狀態
      const [chatMessages, setChatMessages] = useState([
        { role: 'assistant', text: '您好！我是資訊室的 AI 維運小幫手。請問目前有什麼電腦、網路或印表機障礙我可以先幫您初步排解呢？（例如：「印表機卡紙怎麼辦？」或「網路突然斷線了」）' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isChatting, setIsChatting] = useState(false);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        const savedFbConfig = localStorage.getItem('cfg_firebase');
        const savedGeminiKey = localStorage.getItem('cfg_gemini_key');
        const savedUser = localStorage.getItem('it_session_user');
        
        if (savedFbConfig) setFirebaseConfigStr(savedFbConfig);
        if (savedGeminiKey) setGeminiKey(savedGeminiKey);
        
        if (savedUser) {
          const parsed = JSON.parse(savedUser);
          if (parsed.role === 'admin') { setIsLoggedIn(true); setCurrentUser(parsed); }
        }

        let activeDb = null;
        if (savedFbConfig) {
          try {
            const config = JSON.parse(savedFbConfig);
            const app = initializeApp(config);
            const authInstance = getAuth(app);
            activeDb = getFirestore(app);
            signInAnonymously(authInstance);
            setDbInstance(activeDb);
            setDbActive(true);
          } catch (e) { console.error("Firebase 連線失敗:", e); }
        }

        if (activeDb) {
          const appId = 'it-repair-system';
          onSnapshot(collection(activeDb, 'artifacts', appId, 'public', 'data', 'requests'), snap => {
            const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setRequests(list.sort((a,b) => new Date(b.date) - new Date(a.date)));
          });
          onSnapshot(collection(activeDb, 'artifacts', appId, 'public', 'data', 'accounts'), snap => {
            const list = []; snap.forEach(doc => list.push(doc.data())); setAccounts(list.length ? list : DEFAULT_ACCOUNTS);
          });
          onSnapshot(collection(activeDb, 'artifacts', appId, 'public', 'data', 'devices'), snap => {
            const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() })); setDevices(list);
          });
        } else {
          setRequests(JSON.parse(localStorage.getItem('it_requests') || '[]'));
          setAccounts(JSON.parse(localStorage.getItem('it_accounts') || JSON.stringify(DEFAULT_ACCOUNTS)));
          setDevices(JSON.parse(localStorage.getItem('it_devices') || '[]'));
        }
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages]);

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type }); setTimeout(() => setNotification(null), 3000);
      };

      // 匯出 CSV 功能
      const handleExportDevices = () => {
        if (devices.length === 0) return alert("目前沒有資產資料可匯出");
        const header = ["設備編號", "資產名稱", "類別", "購買日期", "使用年限(年)"];
        const rows = devices.map(d => [d.id, d.name, CATEGORIES.find(c=>c.id===d.category)?.name, d.purchaseDate, d.usefulLife]);
        
        let csvContent = "\ufeff" + header.join(",") + "\n" + rows.map(e => e.join(",")).join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `仁德資訊室資產清冊_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 匯入 CSV 功能
      const handleImportDevices = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = event.target.result;
          const lines = content.split("\n").slice(1); // 跳過標題列
          const imported = [];
          
          for (let line of lines) {
            const parts = line.split(",");
            if (parts.length >= 4) {
              const categoryObj = CATEGORIES.find(c => c.name === parts[2].trim()) || CATEGORIES[1];
              imported.push({
                id: parts[0].trim() || `DEV-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
                name: parts[1].trim(),
                category: categoryObj.id,
                purchaseDate: parts[3].trim(),
                usefulLife: parseInt(parts[4]) || 5
              });
            }
          }
          
          if (dbActive) {
            const batch = writeBatch(dbInstance);
            imported.forEach(dev => {
              const ref = doc(dbInstance, 'artifacts', 'it-repair-system', 'public', 'data', 'devices', dev.id);
              batch.set(ref, dev);
            });
            await batch.commit();
          } else {
            const updated = [...devices, ...imported];
            setDevices(updated);
            localStorage.setItem('it_devices', JSON.stringify(updated));
          }
          showToast(`成功匯入 ${imported.length} 筆資產資料`);
        };
        reader.readAsText(file);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const user = accounts.find(u => u.username === e.target.username.value && u.password === e.target.password.value);
        if (!user) return alert('帳密錯誤');
        setCurrentUser(user); setIsLoggedIn(true); setShowLoginModal(false);
        localStorage.setItem('it_session_user', JSON.stringify(user));
        showToast("資訊室成員登入成功");
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        const id = `IT-${Date.now().toString().slice(-6)}`;
        const selDev = devices.find(d => d.id === formData.deviceId);
        const name = formData.deviceId === 'other' ? (formData.otherDeviceName || '未指定') : (selDev?.name || '自定義');
        
        const newReq = { 
          ...formData, id, deviceName: name, username: currentUser.username, 
          requesterName: `${formData.guestName} (Ext: ${formData.guestExt})`,
          status: 'pending', date: new Date().toLocaleString('zh-TW'), adminReply: '' 
        };
        
        if (dbActive) await setDoc(doc(dbInstance, 'artifacts', 'it-repair-system', 'public', 'data', 'requests', id), newReq);
        else {
          const updated = [newReq, ...requests]; setRequests(updated);
          localStorage.setItem('it_requests', JSON.stringify(updated));
        }
        showToast("通報單已送出"); setActiveTab('history');
      };

      const handleChatSubmit = async (e) => {
        e.preventDefault();
        if (!chatInput.trim() || isChatting) return;

        const userMsg = chatInput.trim();
        setChatMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setChatInput('');
        setIsChatting(true);

        const aiResponse = await fetchAIResponse(userMsg, geminiKey);
        
        setChatMessages(prev => [...prev, { role: 'assistant', text: aiResponse }]);
        setIsChatting(false);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* 右上角隱藏登入彈窗 */}
          {showLoginModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center login-modal p-4">
              <div className="w-full max-w-sm bg-white rounded-3xl p-8 shadow-2xl relative">
                <button onClick={()=>setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i className="fa-solid fa-circle-xmark text-2xl"></i></button>
                <div className="text-center mb-6">
                  <i className="fa-solid fa-laptop-code text-4xl text-blue-600 mb-3"></i>
                  <h2 className="text-xl font-bold text-slate-800">資訊室成員登入</h2>
                </div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <input name="username" placeholder="成員帳號" className="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required />
                  <input name="password" type="password" placeholder="安全密碼" className="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required />
                  <button className="w-full bg-slate-800 text-white p-3 rounded-xl font-bold hover:bg-slate-900">進入資訊室後台</button>
                </form>
              </div>
            </div>
          )}

          <header className="bg-white border-b p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
            <div className="flex items-center gap-3">
              <div className="bg-blue-600 text-white p-2 rounded-lg"><i className="fa-solid fa-desktop"></i></div>
              <div>
                <h1 className="font-black text-slate-800 tracking-tight">仁德醫療 - 資訊室通報系統</h1>
                <p className="text-[10px] text-slate-400">連線狀態：{dbActive ? '● 雲端即時同步' : '○ 本地緩存模式'}</p>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-xs font-bold text-blue-700 bg-blue-50 px-3 py-1 rounded-full">{currentUser.name}</span>
              {isLoggedIn ? (
                <button onClick={()=>{localStorage.removeItem('it_session_user'); location.reload();}} className="text-slate-400 hover:text-red-500"><i className="fa-solid fa-power-off text-lg"></i></button>
              ) : (
                <button onClick={()=>setShowLoginModal(true)} className="text-slate-300 hover:text-blue-500"><i className="fa-solid fa-user-gear text-xl"></i></button>
              )}
            </div>
          </header>

          <main className="max-w-5xl mx-auto w-full p-4 flex-grow">
            <div className="flex gap-2 overflow-x-auto pb-4 scrollbar-none mb-4">
              <button onClick={() => setActiveTab('form')} className={`flex-none px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab==='form'?'bg-blue-600 text-white shadow-md':'bg-white text-slate-500 hover:bg-slate-100'}`}>填寫通報</button>
              <button onClick={() => setActiveTab('history')} className={`flex-none px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab==='history'?'bg-blue-600 text-white shadow-md':'bg-white text-slate-500 hover:bg-slate-100'}`}>進度看板</button>
              <button onClick={() => setActiveTab('chat')} className={`flex-none px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab==='chat'?'bg-blue-600 text-white shadow-md':'bg-white text-slate-500 hover:bg-slate-100'}`}>AI 故障諮詢</button>
              
              {isLoggedIn && (
                <>
                  <div className="w-[1px] h-6 bg-slate-200 self-center mx-2"></div>
                  <button onClick={() => setActiveTab('admin-devices')} className={`flex-none px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab==='admin-devices'?'bg-amber-500 text-white shadow-md':'bg-amber-50 text-amber-600'}`}>院區資產列管</button>
                  <button onClick={() => setActiveTab('admin-config')} className={`flex-none px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab==='admin-config'?'bg-slate-800 text-white shadow-md':'bg-slate-100 text-slate-500'}`}><i className="fa-solid fa-gears"></i></button>
                </>
              )}
            </div>

            {/* 內容區域：填寫通報 */}
            {activeTab === 'form' && (
              <div className="bg-white p-6 rounded-3xl shadow-sm border animate-in slide-in-from-bottom-2">
                <h2 className="text-xl font-black mb-6 text-slate-800 flex items-center gap-2"><i className="fa-solid fa-pen-nib text-blue-600"></i> 新增資訊障礙通報</h2>
                <form onSubmit={handleFormSubmit} className="space-y-5">
                  <div className="grid grid-cols-2 gap-4 bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                    <input required placeholder="通報同仁姓名" value={formData.guestName} onChange={e=>setFormData({...formData, guestName:e.target.value})} className="p-3 rounded-xl border bg-white text-sm" />
                    <input required placeholder="聯絡分機 (必填)" value={formData.guestExt} onChange={e=>setFormData({...formData, guestExt:e.target.value})} className="p-3 rounded-xl border bg-white text-sm" />
                  </div>
                  <input required placeholder="障礙主旨 (例如: 護理站電腦無法列印)" value={formData.title} onChange={e=>setFormData({...formData, title:e.target.value})} className="w-full p-4 border rounded-2xl bg-slate-50 outline-none font-bold" />
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input required placeholder="空間位置 (例如: 2樓302病房)" value={formData.location} onChange={e=>setFormData({...formData, location:e.target.value})} className="p-3 border rounded-xl bg-slate-50" />
                    <select value={formData.category} onChange={e=>setFormData({...formData, category:e.target.value, deviceId:''})} className="p-3 border rounded-xl bg-slate-50">
                      {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>
                  <select required value={formData.deviceId} onChange={e=>setFormData({...formData, deviceId:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50">
                    <option value="" disabled>-- 選擇障礙設備 (列管資產) --</option>
                    {devices.filter(d=>d.category===formData.category).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                    <option value="other">其他 / 無列管設備 (手動輸入)</option>
                  </select>
                  {formData.deviceId==='other' && <input placeholder="請輸入詳細設備名稱或特徵" value={formData.otherDeviceName} onChange={e=>setFormData({...formData, otherDeviceName:e.target.value})} className="w-full p-3 border border-blue-300 rounded-xl bg-blue-50/20" />}
                  <textarea required rows="4" placeholder="詳細障礙描述..." value={formData.description} onChange={e=>setFormData({...formData, description:e.target.value})} className="w-full p-4 border rounded-2xl bg-slate-50 outline-none resize-none"></textarea>
                  <button type="submit" className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">送出通報單</button>
                </form>
              </div>
            )}

            {/* 內容區域：AI 故障諮詢 */}
            {activeTab === 'chat' && (
              <div className="bg-white rounded-3xl shadow-sm border flex flex-col h-[550px] overflow-hidden animate-in slide-in-from-bottom-2">
                <div className="p-4 bg-slate-50 border-b flex items-center gap-3">
                  <div className="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center">
                    <i className="fa-solid fa-robot"></i>
                  </div>
                  <div>
                    <h3 className="font-bold text-slate-800">資訊維運智慧助理 (AI)</h3>
                    <p className="text-[10px] text-slate-400">輸入故障描述或維運疑問，由 AI 為您提供即時排障建議</p>
                  </div>
                </div>

                <div className="flex-grow p-4 overflow-y-auto space-y-4 bg-slate-50/30">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm leading-relaxed shadow-sm ${
                        msg.role === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border text-slate-800 rounded-tl-none'
                      }`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                  {isChatting && (
                    <div className="flex justify-start">
                      <div className="bg-white border rounded-2xl rounded-tl-none px-4 py-2 text-xs text-slate-400 flex items-center gap-1.5 shadow-sm">
                        <i className="fa-solid fa-spinner animate-spin text-blue-600"></i> AI 正在分析問題並生成建議中...
                      </div>
                    </div>
                  )}
                  <div ref={messagesEndRef} />
                </div>

                <form onSubmit={handleChatSubmit} className="p-4 border-t bg-white">
                  <div className="flex gap-2">
                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} disabled={isChatting} className="flex-grow px-4 py-3 bg-slate-50 border border-slate-200 rounded-full outline-none text-sm" placeholder="請描述您的問題（如：護理站印表機又卡紙了）..." />
                    <button type="submit" disabled={isChatting || !chatInput.trim()} className="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/10 transition-all">
                      <i className="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                  </div>
                </form>
              </div>
            )}

            {activeTab === 'admin-devices' && isLoggedIn && (
              <div className="bg-white p-6 rounded-3xl border shadow-sm animate-in fade-in">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="font-black text-slate-800 flex items-center gap-2"><i className="fa-solid fa-cubes text-amber-500"></i> 院區資訊資產列管與匯入</h3>
                  <div className="flex gap-2">
                    <label className="bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-emerald-600 transition-all">
                      <i className="fa-solid fa-file-import mr-1"></i> Excel/CSV 批次匯入
                      <input type="file" accept=".csv" className="hidden" onChange={handleImportDevices} />
                    </label>
                    <button onClick={handleExportDevices} className="bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-600 transition-all">
                      <i className="fa-solid fa-file-export mr-1"></i> 匯出資產 Excel
                    </button>
                  </div>
                </div>

                {/* 單筆新增資產 */}
                <form onSubmit={async (e)=>{
                  e.preventDefault();
                  const dev = { ...newDevice, id: `DEV-${Date.now().toString().slice(-4)}` };
                  if(dbActive) await setDoc(doc(dbInstance, 'artifacts', 'it-repair-system', 'public', 'data', 'devices', dev.id), dev);
                  else { const updated = [...devices, dev]; setDevices(updated); localStorage.setItem('it_devices', JSON.stringify(updated)); }
                  setNewDevice({name:'', category:'it_telecom', purchaseDate:'', usefulLife:5});
                  showToast("資產新增成功");
                }} className="bg-slate-50 p-5 rounded-2xl mb-8 grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                   <div className="sm:col-span-4 text-xs font-bold text-slate-500">單筆新增資產</div>
                   <input required placeholder="設備名稱" value={newDevice.name} onChange={e=>setNewDevice({...newDevice, name:e.target.value})} className="p-2.5 rounded-xl border bg-white text-sm" />
                   <select value={newDevice.category} onChange={e=>setNewDevice({...newDevice, category:e.target.value})} className="p-2.5 rounded-xl border bg-white text-sm">
                      {CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                   </select>
                   <input type="date" required value={newDevice.purchaseDate} onChange={e=>setNewDevice({...newDevice, purchaseDate:e.target.value})} className="p-2.5 rounded-xl border bg-white text-sm" />
                   <button type="submit" className="bg-amber-500 text-white font-bold py-2.5 rounded-xl hover:bg-amber-600 transition-all">新增資產</button>
                </form>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b text-slate-400"><th className="pb-3 px-2">設備編號</th><th className="pb-3 px-2">設備名稱</th><th className="pb-3 px-2">類別</th><th className="pb-3 px-2">購買日期</th><th className="pb-3 px-2 text-center">操作</th></tr>
                    </thead>
                    <tbody>
                      {devices.map((dev, i) => (
                        <tr key={i} className="border-b hover:bg-slate-50">
                          <td className="py-3 px-2 font-mono text-xs">{dev.id}</td>
                          <td className="py-3 px-2 font-bold">{dev.name}</td>
                          <td className="py-3 px-2"><span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded">{CATEGORIES.find(c=>c.id===dev.category)?.name}</span></td>
                          <td className="py-3 px-2 font-mono text-xs">{dev.purchaseDate}</td>
                          <td className="py-3 px-2 text-center"><button onClick={async ()=>{
                            if(dbActive) await deleteDoc(doc(dbInstance, 'artifacts', 'it-repair-system', 'public', 'data', 'devices', dev.id));
                            else { const updated = devices.filter(d=>d.id!==dev.id); setDevices(updated); localStorage.setItem('it_devices', JSON.stringify(updated)); }
                            showToast("資產已移除");
                          }} className="text-red-400"><i className="fa-solid fa-trash"></i></button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
            
            {/* 歷史看板分頁 */}
            {activeTab === 'history' && (
              <div className="space-y-4">
                {requests.length === 0 ? (
                  <div className="bg-white rounded-3xl p-16 text-center text-slate-400 border">
                    <i className="fa-solid fa-folder-open text-5xl mb-4 opacity-50 block"></i>
                    <p className="font-bold">目前無任何申報或報修紀錄</p>
                  </div>
                ) : (
                  requests.map(req => (
                    <div key={req.id} className="bg-white p-5 rounded-2xl border shadow-sm">
                      <div className="flex justify-between items-start mb-2">
                         <h4 className="text-lg font-black text-slate-800">{req.title}</h4>
                         <span className={`px-3 py-1 rounded-full text-[10px] font-black ${req.status==='completed'?'bg-green-100 text-green-700':req.status==='processing'?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}`}>
                           {req.status==='completed'?'已結案':req.status==='processing'?'處理中':'待處理'}
                         </span>
                      </div>
                      <div className="flex flex-wrap gap-2 text-xs text-slate-400 mb-2">
                        <span>單號: {req.id}</span>
                        <span>|</span>
                        <span>通報人: {req.requesterName}</span>
                        <span>|</span>
                        <span>地點: {req.location}</span>
                        <span>|</span>
                        <span>設備: {req.deviceName}</span>
                      </div>
                      <p className="text-sm text-slate-700 mb-3">{req.description}</p>
                      
                      {req.adminReply && (
                        <div className="bg-blue-50 p-3 rounded-xl text-sm border-l-4 border-blue-400 mt-2">
                          <span className="font-bold text-blue-800 block text-xs mb-1">資訊室回覆:</span>
                          {req.adminReply}
                        </div>
                      )}
                      
                      {isLoggedIn && (
                        <button onClick={()=>{setEditingReqId(req.id); setAdminReply(req.adminReply || ''); setAdminStatus(req.status || 'pending');}} className="mt-3 text-xs font-bold text-blue-600 hover:underline flex items-center gap-1">
                          <i className="fa-solid fa-comment-dots"></i> 回覆與更新狀態
                        </button>
                      )}
                      
                      {editingReqId === req.id && (
                        <div className="mt-3 p-4 bg-slate-50 rounded-xl space-y-3 border">
                          <div className="flex items-center gap-2">
                            <label className="text-xs font-bold text-slate-600">更新處理進度：</label>
                            <select value={adminStatus} onChange={e=>setAdminStatus(e.target.value)} className="text-xs p-1.5 border rounded bg-white outline-none">
                              <option value="pending">待處理</option>
                              <option value="processing">處理中</option>
                              <option value="completed">已結案</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1">簽核回覆說明：</label>
                            <textarea value={adminReply} onChange={e=>setAdminReply(e.target.value)} className="w-full p-2.5 border rounded-lg text-sm bg-white resize-none" rows="3" placeholder="輸入處理細節與進度..."></textarea>
                          </div>
                          <div className="flex gap-2 justify-end">
                            <button onClick={()=>setEditingReqId(null)} className="text-slate-400 text-xs px-3 py-1.5 rounded hover:bg-slate-200">取消</button>
                            <button onClick={async ()=>{
                              if(dbActive) {
                                await updateDoc(doc(dbInstance, 'artifacts', 'it-repair-system', 'public', 'data', 'requests', req.id), {status: adminStatus, adminReply});
                              } else {
                                const updated = requests.map(r => r.id === req.id ? {...r, status: adminStatus, adminReply} : r);
                                setRequests(updated);
                                localStorage.setItem('it_requests', JSON.stringify(updated));
                              }
                              setEditingReqId(null);
                              showToast("回覆與狀態已成功儲存");
                            }} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-xs font-bold">送出回覆</button>
                          </div>
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            )}

            {/* 同步設定分頁 */}
            {activeTab === 'admin-config' && isLoggedIn && (
              <div className="bg-white p-8 rounded-3xl border shadow-sm animate-in fade-in space-y-6">
                <h3 className="text-xl font-bold text-slate-800"><i className="fa-solid fa-gears text-slate-600 mr-2"></i>系統同步與 AI 助理金鑰設定</h3>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">1. 雲端即時連線資料庫設定 (Firebase Firestore Web Config JSON)</label>
                    <textarea rows="6" placeholder="貼入 Firebase Config JSON..." className="w-full p-4 bg-slate-50 border rounded-2xl font-mono text-xs outline-none focus:ring-2 focus:ring-blue-500" value={firebaseConfigStr} onChange={e => setFirebaseConfigStr(e.target.value)}></textarea>
                  </div>
                  
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">2. 智能客服 AI 引擎金鑰 (Gemini API Key)</label>
                    <input type="password" placeholder="貼入 Gemini API Key..." className="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 font-mono" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} />
                    <span className="text-[10px] text-slate-400 block mt-1"><i className="fa-solid fa-info-circle mr-1"></i>設定此金鑰後，前台的「AI 故障諮詢」即可利用 Gemini AI 引擎回答故障及技術排障問題。</span>
                  </div>

                  <div className="pt-4 border-t flex justify-end">
                    <button onClick={()=>{
                      try {
                        if (firebaseConfigStr.trim()) {
                          JSON.parse(firebaseConfigStr);
                        }
                        localStorage.setItem('cfg_firebase', firebaseConfigStr.trim());
                        localStorage.setItem('cfg_gemini_key', geminiKey.trim());
                        showToast("設定已保存！系統將重新載入啟用設定。");
                        setTimeout(() => location.reload(), 1000);
                      } catch (err) {
                        alert("Firebase Config 格式錯誤，請確保輸入的是正確的 JSON 物件。");
                      }
                    }} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl transition-all shadow-md">
                      儲存配置並刷新連線
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>
          <footer className="p-6 text-center text-slate-400 text-[10px]">© 2026 仁德醫療體系資訊室 - 設施障礙維護雲端管理系統</footer>
          {notification && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-teal-600 px-6 py-3 rounded-2xl text-white font-bold animate-bounce shadow-lg z-[999]">{notification.msg}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
